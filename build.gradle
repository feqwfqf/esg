plugins {
    id 'net.fabricmc.fabric-loom' version '1.19.3'
}

group = 'cc.coffee'
version = '2.0.0+26.3'

repositories { mavenCentral() }
// The bundled 1.8.9 game sources remain reference material during migration.
sourceSets {
    main {
        java.srcDirs = ['src/modern/java']
        resources.srcDirs = ['src/modern/resources']
    }
}

dependencies {
    minecraft 'com.mojang:minecraft:26.3'
    implementation 'net.fabricmc:fabric-loader:0.20.1'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.165.0+26.3'
    testImplementation platform('org.junit:junit-bom:5.14.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach { options.release = 25 }
test { useJUnitPlatform() }
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}
jar { from('LICENSE') { rename { 'LICENSE_coffee' } } }
